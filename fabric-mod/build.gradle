plugins {
    id 'fabric-loom' version '1.3.11'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = "mces"
version = "1.0.0"
group = "dev.tacoagha"

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:1.21.1"
    
    // Fabric
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.15.6"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.3+1.21.1"
    
    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:13.0.121"
    
    // HTTP Client
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

jar {
    from "LICENSE"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    
    repositories {
        // Add your repo credentials here
    }
}
